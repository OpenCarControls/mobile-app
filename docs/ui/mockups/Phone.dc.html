<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vehicle dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.oc-light{--bg:#E7ECEB;--surface:#FFFFFF;--text:#11181A;--text2:#46565A;--accent:#00695C;--onAccentC:#00302A;--outline:#C3CECC;--car:#AEBBB8;--carTop:#C6D0CD;--glass:#6F878C;--wheel:#1E2628;--lamp:#E3E9E7;--lampOn:#FFC933;--ground:#E3E9E7;--seam:#8E9D9A;--tail:#C0392B;--tileBg:rgba(255,255,255,.82);--tileOn:rgba(203,234,228,.94);--tileBorder:rgba(17,24,26,.12);--panelBg:rgba(231,236,235,.66);--road:#7C8B89;--roadLine:#F1F4F3;--headerBg:rgba(231,236,235,.82)}
.oc-dark{--bg:#0C1112;--surface:#151C1E;--text:#E6EEEC;--text2:#9DB0B3;--accent:#4FD8C4;--onAccentC:#BDF2EA;--outline:#2F3D40;--car:#41535A;--carTop:#4E6269;--glass:#1B2A2E;--wheel:#0A0E0F;--lamp:#31424A;--lampOn:#FFD54A;--ground:#121A1C;--seam:#5A6F75;--tail:#E5584A;--tileBg:rgba(31,42,45,.8);--tileOn:rgba(15,63,57,.94);--tileBorder:rgba(230,238,236,.14);--panelBg:rgba(12,17,18,.66);--road:#232E31;--roadLine:#8CA0A4;--headerBg:rgba(12,17,18,.8)}
.oc-light,.oc-dark{--rS:14px;--rM:16px;--rL:24px;--rP:999px;--rRound:50%}
.oc-light.oc-skin-boxy,.oc-dark.oc-skin-boxy{--rS:2px;--rM:2px;--rL:2px;--rP:2px;--rRound:2px}
.oc-light.oc-skin-round,.oc-dark.oc-skin-round{--rS:22px;--rM:28px;--rL:40px;--rP:999px;--rRound:50%}
.oc-light.oc-skin-boxy{--accent:#37474F;--onAccentC:#1C262B;--tileOn:rgba(207,216,220,.94)}
.oc-dark.oc-skin-boxy{--accent:#CFD8DC;--onAccentC:#ECEFF1;--tileOn:rgba(55,71,79,.94)}
.oc-light.oc-skin-round{--accent:#B3245A;--onAccentC:#5B0F2C;--tileOn:rgba(252,214,226,.94)}
.oc-dark.oc-skin-round{--accent:#FF8FB1;--onAccentC:#FFD9E5;--tileOn:rgba(94,26,52,.94)}
.oc-tile{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:10px;border:1px solid var(--tileBorder);border-radius:var(--rM);background:var(--tileBg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.oc-titled{min-height:64px}
.oc-iconly{min-height:56px;align-items:center;justify-content:center}
.oc-tile.on{background:var(--tileOn);color:var(--onAccentC)}
.oc-tile.pending,.oc-round.pending{border-color:var(--accent);animation:ocPulse 1s ease-in-out infinite}
.oc-tile.add{background:transparent;border:1.5px dashed var(--outline);color:var(--text2)}
.oc-cap{font-size:12px;color:var(--text2)}
.oc-glass{border:1px solid var(--tileBorder);background:var(--tileBg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.oc-chip{min-height:44px;padding:0 14px;border-radius:var(--rP);border:1px solid var(--outline);background:var(--surface);color:var(--text);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.oc-round{width:44px;height:44px;flex-shrink:0;border-radius:var(--rRound);border:1px solid var(--outline);background:var(--surface);color:var(--text);font:inherit;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.oc-round.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.oc-xbtn{position:relative;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:var(--rS);border:1px solid var(--outline);background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.oc-xbtn.on{background:var(--tileOn);border-color:var(--accent);color:var(--onAccentC)}
.oc-tag{position:absolute;left:6px;top:3px;font-size:11px;font-weight:800;opacity:.75}
.oc-dots{display:flex;gap:3px;height:5px}
.oc-dots span{width:5px;height:5px;border-radius:50%;background:currentColor}
.oc-sec{display:inline-block;padding:6px 12px;border-radius:var(--rP);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text2)}
.oc-carbox{transition:top .25s ease,height .25s ease}
.oc-tile:focus-visible,.oc-chip:focus-visible,.oc-round:focus-visible,.oc-xbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes ocPulse{50%{opacity:.55}}
@keyframes ocRoad{to{stroke-dashoffset:60}}
.oc-road{animation:ocRoad .6s linear infinite}
@media (prefers-reduced-motion: reduce){.oc-tile.pending,.oc-round.pending,.oc-road{animation:none}.oc-carbox{transition:none}}
</style>
</helmet>
<div class="{{themeClass}}" style="width: {{w}}px; height: {{h}}px; box-sizing: border-box; overflow: hidden; position: relative; background: var(--bg); color: var(--text); font-family: 'Manrope', system-ui, sans-serif">

  <!-- Layer 0: 3D hero slot (placeholder). The real viewer fills this box; it sits centered between the header and the controls, and is scaled to fit its width -->
  <div class="oc-carbox" style="position: absolute; left: 0; top: {{carTop}}px; width: {{heroW}}; height: {{carH}}px; box-sizing: border-box; padding: 0 16px">
    <svg viewBox="0 0 420 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Side view of the vehicle, placeholder for the 3D hero" style="width: 100%; height: 100%; display: block">
      <g opacity="{{roadOp}}">
        <rect x="0" y="0" width="420" height="200" style="fill: var(--road)"/>
        <path class="oc-road" d="M-60 22 H480" style="fill: none; stroke: var(--roadLine); stroke-width: 4; stroke-dasharray: 30 30"/>
        <path d="M0 182 H420" style="fill: none; stroke: var(--roadLine); stroke-width: 3"/>
      </g>
      <g transform="translate(420,0) rotate(90)">
        <ellipse cx="100" cy="212" rx="94" ry="204" style="fill: var(--ground)" opacity="{{groundOp}}"/>
        <rect x="39" y="84" width="13" height="42" rx="5" style="fill: var(--wheel)"/>
        <rect x="148" y="84" width="13" height="42" rx="5" style="fill: var(--wheel)"/>
        <rect x="39" y="300" width="13" height="46" rx="5" style="fill: var(--wheel)"/>
        <rect x="148" y="300" width="13" height="46" rx="5" style="fill: var(--wheel)"/>
        <ellipse cx="43" cy="142" rx="8" ry="5" style="fill: var(--car)"/>
        <ellipse cx="157" cy="142" rx="8" ry="5" style="fill: var(--car)"/>
        <path d="M62 52 C70 24 130 24 138 52 L146 120 C150 160 152 260 150 330 C148 380 132 398 100 398 C68 398 52 380 50 330 C48 260 50 160 54 120 Z" style="fill: var(--car); stroke: var(--seam); stroke-width: 1"/>
        <path d="M66 126 L134 126 L127 168 L73 168 Z" style="fill: var(--glass)"/>
        <rect x="73" y="168" width="54" height="94" rx="9" style="fill: var(--carTop)"/>
        <path d="M73 262 L127 262 L134 296 L66 296 Z" style="fill: var(--glass)"/>
        <path d="M52 176 H148 M51 262 H149" style="fill: none; stroke: var(--seam); stroke-width: 1"/>
        <path d="M64 52 L86 47 L86 54 L67 60 Z" style="fill: {{lampFill}}"/>
        <path d="M136 52 L114 47 L114 54 L133 60 Z" style="fill: {{lampFill}}"/>
        <rect x="70" y="388" width="60" height="4" rx="2" style="fill: var(--tail)"/>
        <circle cx="150" cy="352" r="24" style="fill: var(--accent)" opacity="{{portGlow}}"/>
        <path d="M152 352 C170 360 186 372 192 396" style="fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round" opacity="{{portOp}}"/>
        <circle cx="150" cy="352" r="6" style="fill: var(--accent)" opacity="{{portOp}}"/>
      </g>
    </svg>
  </div>

  <!-- Layer 1: scrolling controls. They rest at the bottom when short and scroll over the car once there is no room left -->
  <div style="position: absolute; top: 0; bottom: 0; right: 0; left: {{ctlLeft}}; overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column; background: {{ctlBg}}; border-left: {{ctlBorder}}; padding: {{ctlPad}}">
    <div style="flex: {{spacerGrow}} 0 {{spacerH}}px"></div>
    <div ref="{{setPanel}}" style="flex-shrink: 0; box-sizing: border-box; padding: {{wrapPad}}; background: {{wrapBg}}; -webkit-backdrop-filter: {{wrapBlur}}; backdrop-filter: {{wrapBlur}}; border-radius: {{wrapRadius}}; border-top: {{wrapBorder}}">

    <div style="display: grid; grid-template-columns: repeat({{cols}}, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
        <button class="oc-tile {{tileMode}} {{t.cls}}" aria-label="{{t.aria}}" onClick="{{t.tap}}">
          <svg viewBox="0 0 24 24" width="{{iconSize}}" height="{{iconSize}}" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg>
          <sc-if value="{{showTitle}}" hint-placeholder-val="{{ true }}">
            <span style="font-size: 12px; font-weight: 700">{{t.label}}</span>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <!-- Climate: the bar always shows inside/outside temperature. Target and extras unfold under it when climate is on -->
    <div class="oc-glass" style="margin-top: 8px; border-radius: var(--rM); overflow: hidden">
      <div style="height: 64px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <div style="display: flex; align-items: center; gap: 10px; min-width: 0">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="{{iTemp}}"/></svg>
          <div style="min-width: 0">
            <div style="font-size: 14px; font-weight: 700">Climate</div>
            <div class="oc-cap">{{climateCap}}</div>
          </div>
        </div>
        <button class="oc-round {{climateCls}}" aria-label="{{climateAria}}" onClick="{{climateTap}}">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{iPower}}"/></svg>
        </button>
      </div>
      <sc-if value="{{climateOn}}" hint-placeholder-val="{{ false }}">
        <div style="border-top: 1px solid var(--tileBorder); padding: 12px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px; border-radius: var(--rP); background: var(--surface); border: 1px solid var(--outline)">
            <button class="oc-round" aria-label="Lower temperature" onClick="{{tempDown}}" style="border-color: transparent">−</button>
            <span style="font-size: 22px; font-weight: 800">{{tempLabel}}</span>
            <button class="oc-round" aria-label="Raise temperature" onClick="{{tempUp}}" style="border-color: transparent">+</button>
          </div>
          <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{extras}}" as="x" hint-placeholder-count="5">
              <button class="oc-xbtn {{x.cls}}" aria-label="{{x.aria}}" onClick="{{x.tap}}">
                <sc-if value="{{x.hasTag}}" hint-placeholder-val="{{ false }}">
                  <span class="oc-tag" aria-hidden="true">{{x.tag}}</span>
                </sc-if>
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: scaleX({{x.flip}})"><path d="{{x.icon}}"/></svg>
                <sc-if value="{{x.hasDots}}" hint-placeholder-val="{{ false }}">
                  <span class="oc-dots" aria-hidden="true"><span style="opacity: {{x.d1}}"></span><span style="opacity: {{x.d2}}"></span><span style="opacity: {{x.d3}}"></span></span>
                </sc-if>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-if>
    </div>

    <sc-if value="{{isBle}}" hint-placeholder-val="{{ false }}">
      <div>
        <div style="display: flex; align-items: center; justify-content: space-between; margin: 20px 0 8px">
          <span class="oc-sec oc-glass">Live data</span>
          <button class="oc-chip oc-glass">Edit layout</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{stats}}" as="st" hint-placeholder-count="6">
            <div class="oc-glass" style="padding: 12px; border-radius: var(--rM)">
              <div class="oc-cap">{{st.label}}</div>
              <div style="margin-top: 2px"><span style="font-size: 18px; font-weight: 800">{{st.value}}</span><span style="font-size: 12px; font-weight: 600; color: var(--text2)"> {{st.unit}}</span></div>
            </div>
          </sc-for>
        </div>

        <div class="oc-sec oc-glass" style="margin: 20px 0 8px">Advanced controls</div>
        <div style="display: grid; grid-template-columns: repeat({{cols}}, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{advTiles}}" as="a" hint-placeholder-count="2">
            <button class="oc-tile {{tileMode}} {{a.cls}}" aria-label="{{a.aria}}" onClick="{{a.tap}}">
              <svg viewBox="0 0 24 24" width="{{iconSize}}" height="{{iconSize}}" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"/></svg>
              <sc-if value="{{showTitle}}" hint-placeholder-val="{{ true }}">
                <span style="font-size: 12px; font-weight: 700">{{a.label}}</span>
              </sc-if>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-if>
    </div>
  </div>

  <!-- Layer 2: pinned header. Translucent so scrolled controls blur out underneath -->
  <div ref="{{setHeader}}" style="position: absolute; left: 0; top: 0; width: {{heroW}}; box-sizing: border-box; padding: {{heroPad}}; background: {{headerBg}}; -webkit-backdrop-filter: {{headerBlur}}; backdrop-filter: {{headerBlur}}">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="min-width: 0">
        <div style="font-size: 20px; font-weight: 800; line-height: 1.2">{{vehicleName}}</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: var(--rP); background: var(--surface); border: 1px solid var(--outline); font-size: 13px; font-weight: 600">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: {{dotColor}}"></span>
          <span>{{connLabel}}</span>
        </div>
        <button aria-label="Settings" style="width: 44px; height: 44px; border-radius: var(--rRound); border: 1px solid var(--outline); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{iSettings}}"/></svg>
        </button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; margin-top: 14px">
      <sc-if value="{{isEv}}" hint-placeholder-val="{{ true }}">
        <svg width="46" height="24" viewBox="0 0 46 24" role="img" aria-label="Battery level {{level}} percent" style="flex-shrink: 0">
          <rect x="1" y="1" width="40" height="22" rx="6" style="fill: none; stroke: var(--text); stroke-width: 2"/>
          <rect x="4.5" y="4.5" width="{{fillW}}" height="15" rx="3" style="fill: var(--accent)"/>
          <rect x="43" y="8" width="3" height="8" rx="1.5" style="fill: var(--text)"/>
        </svg>
      </sc-if>
      <sc-if value="{{isIce}}" hint-placeholder-val="{{ false }}">
        <svg width="34" height="30" viewBox="0 0 34 30" role="img" aria-label="Fuel level {{level}} percent" style="flex-shrink: 0">
          <rect x="2" y="2" width="16" height="26" rx="3" style="fill: none; stroke: var(--text); stroke-width: 2"/>
          <rect x="5" y="{{tankY}}" width="10" height="{{tankH}}" rx="1.5" style="fill: var(--accent)"/>
          <path d="M18 11h3a2 2 0 0 1 2 2v8a2.5 2.5 0 0 0 5 0V11l-4-4" style="fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"/>
        </svg>
      </sc-if>
      <span style="font-size: 26px; line-height: 1.1; font-weight: 800">{{level}}%</span>
      <span style="font-size: 15px; font-weight: 600; color: var(--text2)">{{range}} {{rangeUnit}}</span>
      <sc-if value="{{isDriving}}" hint-placeholder-val="{{ false }}">
        <div style="margin-left: auto; text-align: right">
          <div style="color: var(--text2); font-size: 12px; font-weight: 600">Speed</div>
          <div style="display: flex; align-items: baseline; justify-content: flex-end; gap: 4px">
            <span style="font-size: 26px; line-height: 1.1; font-weight: 800">{{speed}}</span>
            <span style="font-size: 14px; font-weight: 600; color: var(--text2)">{{speedUnit}}</span>
          </div>
        </div>
      </sc-if>
    </div>

    <sc-if value="{{hasStatus}}" hint-placeholder-val="{{ true }}">
      <div style="margin-top: 10px; font-size: 14px; font-weight: 600; color: {{statusColor}}">{{statusLine}}</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"vehicle":{"editor":"enum","default":"ev","options":["ev","ice"]},"tier":{"editor":"enum","default":"ble","options":["remote","ble"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"layout":{"editor":"enum","default":"phone","options":["phone","wide"]},"buttons":{"editor":"enum","default":"titled","options":["titled","icon"]},"skin":{"editor":"enum","default":"default","options":["default","boxy","round"]},"driving":{"editor":"boolean","default":false},"connected":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { locked: true, climate: false, port: true, precond: false, pending: null, temp: 21, defF: false, defR: false, wheel: false, seatD: 0, seatP: 0, win: 'closed', hdrH: 150, panelH: 240 };

  setHeader = (n) => { this._hdr = n; };
  setPanel = (n) => { this._pnl = n; };

  // The car is centered between the header and the controls, so both heights are measured
  measure() {
    const h = this._hdr ? this._hdr.offsetHeight : 0;
    const p = this._pnl ? this._pnl.offsetHeight : 0;
    if ((h && Math.abs(h - this.state.hdrH) > 1) || (p && Math.abs(p - this.state.panelH) > 1)) {
      this.setState({ hdrH: h || this.state.hdrH, panelH: p || this.state.panelH });
    }
  }

  componentDidMount() {
    this.measure();
    if (window.ResizeObserver) {
      this._ro = new ResizeObserver(() => this.measure());
      if (this._hdr) this._ro.observe(this._hdr);
      if (this._pnl) this._ro.observe(this._pnl);
    }
  }

  componentDidUpdate() { this.measure(); }

  componentWillUnmount() {
    clearTimeout(this._timer);
    if (this._ro) this._ro.disconnect();
  }

  act(key, apply, ms) {
    return () => {
      if (this.state.pending) return;
      this.setState({ pending: key });
      this._timer = setTimeout(() => {
        this.setState({ ...apply(this.state), pending: null });
      }, ms || 800);
    };
  }

  renderVals() {
    const pr = this.props, s = this.state;
    const ev = (pr.vehicle ?? 'ev') === 'ev';
    const ble = (pr.tier ?? 'ble') === 'ble';
    const wide = (pr.layout ?? 'phone') === 'wide';
    const dark = (pr.theme ?? 'light') === 'dark';
    const iconOnly = pr.buttons === 'icon';
    const driving = pr.driving === true || pr.driving === 'true';
    const connected = !(pr.connected === false || pr.connected === 'false');
    const p = s.pending;
    const H = wide ? 720 : 844;
    const MINCAR = 280;

    const I = {
      lock: 'M7 11V8a5 5 0 0 1 10 0v3 M5 11h14v10H5z',
      unlock: 'M7 11V8a5 5 0 0 1 9.5-2 M5 11h14v10H5z',
      temp: 'M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z',
      power: 'M12 2v10 M18.4 6.6a9 9 0 1 1-12.8 0',
      plug: 'M9 2v6 M15 2v6 M6 8h12v4a6 6 0 0 1-12 0z M12 18v4',
      bulb: 'M9 18h6 M10 21h4 M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z',
      winClosed: 'M5 4h14v16H5z M5 10h14',
      winVent: 'M5 4h14v16H5z M5 15h14',
      heat: 'M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z',
      sliders: 'M4 7h9 M17 7h3 M4 17h3 M11 17h9 M13 4v6 M7 14v6',
      plus: 'M12 5v14 M5 12h14',
      defFront: 'M4 19l3-12h10l3 12z M9.5 10c.8.8.8 1.7 0 2.5s-.8 1.7 0 2.5 M12 10c.8.8.8 1.7 0 2.5s-.8 1.7 0 2.5 M14.5 10c.8.8.8 1.7 0 2.5s-.8 1.7 0 2.5',
      defRear: 'M4 6h16v12H4z M9.5 9c.8.8.8 1.7 0 2.5s-.8 1.7 0 2.5 M12 9c.8.8.8 1.7 0 2.5s-.8 1.7 0 2.5 M14.5 9c.8.8.8 1.7 0 2.5s-.8 1.7 0 2.5',
      wheel: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M3 11h6l3 3 3-3h6',
      seat: 'M8 3l1.5 9H18l1 6H8 M8 18v3 M19 18v3'
    };

    // Status is carried by fill and icon state, so a button is just icon (+ title)
    const mk = (key, label, icon, on, cap, apply, ms) => ({
      key, label, icon,
      aria: label + ', ' + cap,
      cls: (on ? 'on ' : '') + (p === key ? 'pending' : ''),
      tap: this.act(key, apply, ms)
    });

    const tiles = [];
    tiles.push(mk('lock', 'Doors', s.locked ? I.lock : I.unlock, s.locked, s.locked ? 'locked' : 'unlocked', (st) => ({ locked: !st.locked }), 700));
    if (ev) tiles.push(mk('port', 'Port', I.plug, s.port, s.port ? 'open' : 'closed', (st) => ({ port: !st.port }), 900));
    tiles.push(mk('flash', 'Lights', I.bulb, false, 'flash once', () => ({}), 1000));
    tiles.push(mk('win', 'Windows', s.win === 'vent' ? I.winVent : I.winClosed, s.win === 'vent', s.win === 'vent' ? 'vented' : 'closed', (st) => ({ win: st.win === 'vent' ? 'closed' : 'vent' }), 900));

    const seatLabels = ['off', 'low', 'medium', 'high'];
    const seat = (key, tag, who, flip) => {
      const lvl = s[key];
      return {
        icon: I.seat, flip, hasTag: true, tag, hasDots: true,
        d1: lvl >= 1 ? 1 : 0.25, d2: lvl >= 2 ? 1 : 0.25, d3: lvl >= 3 ? 1 : 0.25,
        aria: who + ' seat heating, ' + seatLabels[lvl],
        cls: lvl ? 'on' : '',
        tap: () => this.setState({ [key]: (lvl + 1) % 4 })
      };
    };
    const extras = [
      { icon: I.defFront, hasTag: false, tag: '', hasDots: false, d1: 1, d2: 1, d3: 1, aria: 'Windshield defrost, ' + (s.defF ? 'on' : 'off'), cls: s.defF ? 'on' : '', tap: () => this.setState({ defF: !s.defF }) },
      { icon: I.defRear, hasTag: false, tag: '', hasDots: false, d1: 1, d2: 1, d3: 1, aria: 'Rear defrost, ' + (s.defR ? 'on' : 'off'), cls: s.defR ? 'on' : '', tap: () => this.setState({ defR: !s.defR }) },
      { icon: I.wheel, hasTag: false, tag: '', hasDots: false, d1: 1, d2: 1, d3: 1, aria: 'Steering wheel heater, ' + (s.wheel ? 'on' : 'off'), cls: s.wheel ? 'on' : '', tap: () => this.setState({ wheel: !s.wheel }) },
      seat('seatD', 'L', 'Left', 1),
      seat('seatP', 'R', 'Right', -1)
    ].map((x) => ({ flip: 1, ...x }));

    const stats = ev
      ? [
          { label: 'Pack voltage', value: '697', unit: 'V' },
          { label: 'Power', value: driving ? '−18.4' : '7.2', unit: 'kW' },
          { label: 'Gear', value: driving ? 'D' : 'P', unit: '' },
          { label: 'Pack min', value: '24', unit: '°C' },
          { label: 'Pack max', value: '27', unit: '°C' },
          { label: 'Power state', value: driving ? 'Ready' : 'Off', unit: '' }
        ]
      : [
          { label: 'Coolant', value: '90', unit: '°C' },
          { label: 'Oil', value: '96', unit: '°C' },
          { label: 'Engine', value: driving ? 'On' : 'Off', unit: '' },
          { label: '12 V battery', value: '12.6', unit: 'V' },
          { label: 'Gear', value: driving ? 'D' : 'P', unit: '' },
          { label: 'Power state', value: driving ? 'Ready' : 'Off', unit: '' }
        ];

    const advTiles = [
      mk('precond', ev ? 'Preheat' : 'Pre-heat', I.heat, s.precond, s.precond ? 'heating' : 'off', (st) => ({ precond: !st.precond }), 900),
      { key: 'add', label: 'Add', icon: I.plus, aria: 'Add a control', cls: 'add', tap: () => {} }
    ];

    const charging = ev && s.port && !driving;
    const statusLine = driving ? 'Driving' : (charging ? 'Charging · 7.2 kW · 1 h 05 to 80%' : '');

    const clamp = (v) => Math.min(28, Math.max(16, v));
    const climatePending = p === 'climate';
    const level = ev ? 64 : 62;
    const tankH = Math.round(20 * level) / 100;

    // Car box: centered between header and controls; never smaller than MINCAR (then the controls scroll over it)
    const carTop = s.hdrH;
    const carH = wide ? H - s.hdrH - 16 : Math.max(MINCAR, H - s.panelH - s.hdrH);

    return {
      themeClass: (dark ? 'oc-dark' : 'oc-light') + ' oc-skin-' + (pr.skin === 'boxy' || pr.skin === 'round' ? pr.skin : 'default'),
      w: wide ? 1024 : 390,
      h: H,
      heroW: wide ? 'calc(100% - 440px)' : '100%',
      heroPad: wide ? '32px 32px 12px' : '24px 16px 14px',
      headerBg: wide ? 'transparent' : 'var(--headerBg)',
      headerBlur: wide ? 'none' : 'blur(16px)',
      carTop,
      carH,
      setHeader: this.setHeader,
      setPanel: this.setPanel,
      ctlLeft: wide ? 'calc(100% - 440px)' : '0',
      ctlBg: wide ? 'var(--surface)' : 'transparent',
      ctlBorder: wide ? '1px solid var(--outline)' : '0',
      ctlPad: wide ? '28px 24px 32px' : '0',
      spacerH: wide ? 0 : s.hdrH + MINCAR,
      spacerGrow: wide ? 0 : 1,
      wrapPad: wide ? '0' : '16px 16px 34px',
      wrapBg: wide ? 'transparent' : 'var(--panelBg)',
      wrapBlur: wide ? 'none' : 'blur(18px)',
      wrapRadius: wide ? '0' : 'var(--rL) var(--rL) 0 0',
      wrapBorder: wide ? '0' : '1px solid var(--tileBorder)',
      cols: 4,
      tileMode: iconOnly ? 'oc-iconly' : 'oc-titled',
      showTitle: !iconOnly,
      iconSize: iconOnly ? 26 : 22,
      vehicleName: ev ? 'EV6' : 'Example ICE',
      connLabel: connected ? (ble ? 'Bluetooth' : 'Remote') : 'Offline · Updated 12 min ago',
      dotColor: connected ? 'var(--accent)' : 'var(--text2)',
      range: ev ? '312' : '486',
      rangeUnit: 'km',
      level,
      isEv: ev,
      isIce: !ev,
      fillW: Math.round(33 * level) / 100,
      tankH,
      tankY: 5 + 20 - tankH,
      hasStatus: statusLine !== '',
      statusLine,
      statusColor: charging ? 'var(--accent)' : 'var(--text)',
      lampFill: p === 'flash' ? 'var(--lampOn)' : 'var(--lamp)',
      portGlow: charging ? 0.28 : 0,
      portOp: ev && s.port ? 1 : 0,
      tiles,
      extras,
      stats,
      advTiles,
      climateOn: s.climate,
      climateCap: 'Inside 19.5° · Outside 12°',
      climateCls: (s.climate ? 'on ' : '') + (climatePending ? 'pending' : ''),
      climateAria: s.climate ? 'Turn climate off' : 'Turn climate on',
      climateTap: this.act('climate', (st) => ({ climate: !st.climate }), 900),
      tempLabel: s.temp.toFixed(1) + '°C',
      tempDown: () => this.setState({ temp: clamp(s.temp - 0.5) }),
      tempUp: () => this.setState({ temp: clamp(s.temp + 0.5) }),
      isBle: ble,
      isDriving: driving,
      speed: 62,
      speedUnit: 'km/h',
      roadOp: driving ? 1 : 0,
      groundOp: driving ? 0 : 1,
      iSettings: I.sliders,
      iTemp: I.temp,
      iPower: I.power
    };
  }
}
</script>
</body>
</html>
