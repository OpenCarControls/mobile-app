<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vehicle switcher</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.sw-row{box-sizing:border-box;width:100%;min-height:64px;padding:10px 14px;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.sw-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
</style>
</helmet>
<div class="oc-light oc-skin-default" style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif">

  <dc-import name="Phone" vehicle="ev" tier="remote" theme="light" layout="phone" hint-size="390px,844px"></dc-import>

  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(17,24,26,.4)"></div>

  <div role="dialog" aria-label="Vehicles" style="position: absolute; left: 12px; top: 74px; width: 340px; box-sizing: border-box; background: var(--surface); color: var(--text); border: 1px solid var(--tileBorder); border-radius: var(--rL); box-shadow: 0 18px 48px rgba(0,0,0,.28); overflow: hidden">
    <span style="position: absolute; top: -8px; left: 36px; width: 16px; height: 16px; background: var(--surface); border-left: 1px solid var(--tileBorder); border-top: 1px solid var(--tileBorder); transform: rotate(45deg)"></span>

    <div style="padding-top: 6px">
      <sc-for list="{{vehicles}}" as="v" hint-placeholder-count="3">
        <button class="sw-row" aria-label="{{v.aria}}">
          <span style="width: 44px; height: 44px; border-radius: var(--rRound); display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: {{v.bg}}; color: {{v.fg}}">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16l1.5-5a2 2 0 0 1 1.9-1.4h7.2a2 2 0 0 1 1.9 1.4L19 16 M4 16h16v3H4z M7 19v1.5 M17 19v1.5 M7.5 13.5h.01 M16.5 13.5h.01"/></svg>
          </span>
          <span style="flex: 1; min-width: 0">
            <span style="display: block; font-size: 16px; font-weight: 700">{{v.name}}</span>
            <span style="display: block; font-size: 12px; color: var(--text2); margin-top: 1px">{{v.sub}}</span>
          </span>
          <sc-if value="{{v.current}}" hint-placeholder-val="{{ false }}">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <div style="border-top: 1px solid var(--tileBorder); padding: 4px 0 6px">
      <button class="sw-row" style="min-height: 56px">
        <span style="width: 44px; height: 44px; border-radius: var(--rRound); border: 1.5px dashed var(--outline); color: var(--text2); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"/></svg></span>
        <span style="font-size: 15px; font-weight: 600">Add a vehicle</span>
      </button>
      <button class="sw-row" style="min-height: 48px; justify-content: space-between; color: var(--text2)">
        <span style="font-size: 14px; font-weight: 600">Manage vehicles</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Each vehicle keeps its own skin colours, so the list shows which car is which
    const teal = { bg: 'rgba(203,234,228,.94)', fg: '#00302A' };
    const steel = { bg: 'rgba(207,216,220,.94)', fg: '#1C262B' };
    const rose = { bg: 'rgba(252,214,226,.94)', fg: '#5B0F2C' };
    const vehicles = [
      { ...teal, name: 'EV6', sub: '64% · 312 km · Remote', current: true, aria: 'EV6, current vehicle' },
      { ...steel, name: 'Weekend car', sub: '41% · 380 km · Updated 3 h ago', current: false, aria: 'Switch to Weekend car' },
      { ...rose, name: 'City car', sub: '88% · 214 km · Updated yesterday', current: false, aria: 'Switch to City car' }
    ];
    return { vehicles };
  }
}
</script>
</body>
</html>
