# Dependabot version updates. Updates are grouped so a month's worth of bumps
# lands as a handful of PRs instead of one per package. Security updates are
# not affected by the schedule; they are opened as soon as an advisory appears.
version: 2
updates:
  - package-ecosystem: pub
    directories:
      - /
      - /tool/builders
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # web_3d (three.js viewer bundled into the app).
  - package-ecosystem: npm
    directory: /web_3d
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Android Gradle plugin, Kotlin plugin and the Gradle wrapper. These must stay
  # compatible with the Flutter version in .flutter-version; CI's APK build
  # catches a mismatch.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      android-build:
        patterns: ["*"]

  # Dev container features (Node).
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # The shared contracts submodule.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
