name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The action reads flutter-version-file as a pubspec, so a plain version
      # file gave no version and CI took the latest stable.
      - name: Read the pinned Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Clang, libc++ and the graphics headers: flutter test runs Thermion's build hook,
      # which compiles its native library for the Linux host.
      - name: Install protoc and the host C++ toolchain
        run: >-
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          clang libc++-dev libc++abi-dev libgl-dev libegl-dev libgles-dev libdrm-dev libgbm-dev

      - name: Install protoc_plugin
        run: |
          dart pub global activate protoc_plugin 25.1.0
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate code
        run: dart run build_runner build

      - name: Verify formatting
        run: find lib test -name "*.dart" ! -name "*.g.dart" ! -path "*/generated/*" | xargs dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The action reads flutter-version-file as a pubspec, so a plain version
      # file gave no version and CI took the latest stable.
      - name: Read the pinned Flutter version
        run: echo "FLUTTER_VERSION=$(cat .flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc_plugin
        run: |
          dart pub global activate protoc_plugin 25.1.0
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate code
        run: dart run build_runner build

      # Thermion ships arm64 native libraries only.
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
