name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create Tag, Release & APK
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc_plugin
        run: |
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web_3d/package-lock.json

      # The 3D viewer bundle in assets/web/ is gitignored; pubspec.yaml needs it.
      - name: Build 3D viewer
        working-directory: web_3d
        run: npm ci && npm run build

      # Majors are pinned: the conventionalcommits preset must match the
      # conventional-changelog-writer major bundled by release-notes-generator.
      - name: Install release tooling
        run: >-
          npm install --no-save
          semantic-release@25
          @semantic-release/commit-analyzer@13
          @semantic-release/exec@7
          @semantic-release/release-notes-generator@14
          @semantic-release/github@12
          conventional-changelog-conventionalcommits@9

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release